name: Contrôle automatique

# À chaque push sur main : le jeu est lancé dans de vrais navigateurs (3 machines en parallèle :
# vues fixes, missions 1 à 6, missions 7 à 9 + fight club), puis controle/RAPPORT.md est publié
# dans le dépôt. Un nouveau push annule le contrôle en cours : seul le dernier commit compte.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'controle/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: controle-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  geospatial:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer Shapely pour les tests de géométrie
        run: pip install shapely
      - name: Tester les profils routiers OSM
        run: python tests/test_street_profiles.py
      - name: Tester la fusion polygonale des carrefours
        run: python tests/test_street_geometry.py
      - name: Tester l'extraction des restrictions OSM
        run: python tests/test_osm_restrictions.py
      - name: Tester le complément OSM sans réseau
        run: python tests/test_complete_osm_extract.py
      - name: Tester le graphe OSM avec provenance
        run: python tests/test_build_osm_graph.py

  partie:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        part: [vues, m1-6, m7-9]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Installer le navigateur de test
        run: |
          pip install playwright==1.47.0 pillow numpy
          python -m playwright install --with-deps chromium
      - name: Contrôle (${{ matrix.part }})
        run: |
          mkdir -p partie
          python tests/ci.py --part ${{ matrix.part }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: partie-${{ matrix.part }}
          path: partie/
          if-no-files-found: warn

  rapport:
    needs: [partie, geospatial]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow numpy playwright==1.47.0
      - uses: actions/download-artifact@v4
        with:
          path: parties/
      - name: Assembler le rapport
        id: run
        continue-on-error: true
        run: python tests/ci.py --merge parties
      - name: Publier le rapport dans le dépôt
        if: github.event_name == 'push'
        run: |
          git config user.name "controle-automatique"
          git config user.email "controle-automatique@users.noreply.github.com"
          verdict=$(head -1 controle/RAPPORT.md | sed 's/# Contrôle automatique — //')
          cp -r controle /tmp/controle-nouveau
          for i in 1 2 3 4 5; do
            # toujours repartir du dernier main (un autre push a pu arriver pendant le contrôle)
            git fetch origin main && git checkout -B publication origin/main
            rm -rf controle && cp -r /tmp/controle-nouveau controle
            git add -A controle
            git commit -m "Contrôle automatique de ${GITHUB_SHA::7} : ${verdict} [skip ci]" || exit 0
            git push origin publication:main && exit 0
            sleep 5
          done
          exit 1
      - name: Résumé
        if: always()
        run: cat controle/RAPPORT.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Verdict
        if: steps.run.outcome == 'failure'
        run: |
          echo "::error::Verdict KO — voir controle/RAPPORT.md"
          exit 1
